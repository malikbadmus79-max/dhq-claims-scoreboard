date_range:
  start: 2021-01-01
  end: 2026-10-31

user_agent: "dhq-claims-scoreboard/0.1 (research project; +https://github.com/malikbadmus79-max/dhq-claims-scoreboard)"

min_delay_seconds: 5
# Longer delays for named domains; every other domain uses min_delay_seconds. The Wayback
# Machine answered HTTP 429 at 5 seconds on 2026-10-18 (docs/source_access_log.csv).
domain_delay_seconds:
  web.archive.org: 15
  archive.org: 15
obey_robots_txt: true

# Full discovery: wall-clock limit per outlet-year, retries included. An outlet-year past it is
# stopped, logged ("time budget exceeded") and marked incomplete; its counts are lower bounds.
outlet_year_budget_minutes: 15

outlets:
  - name: Defence Headquarters
    domain: defencehq.mil.ng
  - name: Voice of Nigeria
    domain: von.gov.ng
  - name: News Agency of Nigeria
    domain: nannews.ng
  - name: TheCable
    domain: thecable.ng
  - name: Premium Times
    domain: premiumtimesng.com
  - name: Leadership
    domain: leadership.ng
  - name: Blueprint
    domain: blueprint.ng
  - name: TheWill
    domain: thewillnews.com
  - name: Gazette
    domain: gazettengr.com
  - name: 21st Century Chronicle
    domain: 21stcenturychronicle.com
  - name: AllAfrica
    domain: allafrica.com
  - name: Daily Trust
    domain: dailytrust.com
  - name: Daily Post
    domain: dailypost.ng
  - name: Channels TV
    domain: channelstv.com

wire_copy:
  # Primary same_wire threshold (word 5-gram Jaccard, digits removed). 0.3 is the
  # low-density gap in the 2024 pilot pair distribution: 7 of 179 pairs fall
  # between 0.2 and 0.4 (outputs/tables/pilot_copy_similarity_2024.csv).
  same_wire_threshold: 0.3
  # Reported as sensitivity columns in pilot_copy_groups_<year>.csv.
  sensitivity_thresholds: [0.45, 0.6]
